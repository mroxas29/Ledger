<body>

<div id="ledgerPage" class="page">
  <header>
    <div class="header-top-row">
      <button id="dashBtn" class="icon-btn" aria-label="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M12 20V4M20 20V14"/></svg>
      </button>
      <div class="month-row">
        <button id="prevMonth" class="chev" aria-label="Previous month">&lsaquo;</button>
        <div class="month-label" id="monthLabel">September 2026</div>
        <button id="nextMonth" class="chev" aria-label="Next month">&rsaquo;</button>
      </div>
      <button id="menuBtn" class="icon-btn" aria-label="Menu">&#8942;</button>
    </div>
    <div class="balance" id="balanceLabel">$0.00</div>
    <div class="sub-totals">
      <span><span class="lbl">INCOME</span><span class="val-in" id="incomeTotal">$0.00</span></span>
      <span><span class="lbl">EXPENSES</span><span class="val-out" id="expenseTotal">$0.00</span></span>
    </div>
    <div class="daily-spend" id="dailySpend">
      <div class="ds-top"><span class="ds-label">Today's Spend</span><span class="ds-amount" id="dailySpendAmount">$0.00</span></div>
      <div class="ds-track"><div class="ds-bar" id="dailySpendBar"></div></div>
    </div>
    <div class="quick-graph">
      <div class="qg-row"><span class="qg-label">Income</span><div class="qg-track"><div class="qg-bar income" id="qgIncomeBar"></div></div></div>
      <div class="qg-row"><span class="qg-label">Expenses</span><div class="qg-track"><div class="qg-bar expense" id="qgExpenseBar"></div></div></div>
    </div>
    <div class="tabs" id="filterTabs">
      <button data-filter="all" class="active">All</button>
      <button data-filter="income">Income</button>
      <button data-filter="expense">Expense</button>
    </div>
  </header>

  <main>
    <div class="list-total" id="listTotal"></div>
    <div id="list"></div>
  </main>

  <button id="fab" aria-label="Add transaction">+</button>
</div>

<div id="dashboardPage" class="page" style="display:none;">
  <header>
    <div class="header-top-row">
      <button id="dashBackBtn" class="icon-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="month-label" style="flex:1;">Dashboard</div>
      <span class="icon-spacer"></span>
    </div>
    <div class="tabs" id="rangeTabs">
      <button data-range="1y" class="active">1 Year</button>
      <button data-range="2y">2 Years</button>
      <button data-range="all">All Time</button>
    </div>
  </header>
  <main>
    <div class="summary-card">
      <div class="balance" id="dashBalance">$0.00</div>
      <div class="sub-totals">
        <span><span class="lbl">INCOME</span><span class="val-in" id="dashIncome">$0.00</span></span>
        <span><span class="lbl">EXPENSES</span><span class="val-out" id="dashExpense">$0.00</span></span>
      </div>
    </div>
    <div id="dashList"></div>
  </main>
</div>

<div id="overlay"></div>

<div id="sheet">
  <div class="sheet-handle"></div>
  <div class="type-toggle">
    <button type="button" data-type="expense" class="active">Expense</button>
    <button type="button" data-type="income">Income</button>
  </div>
  <div class="amount-row">
    <span id="currencySymbol">$</span>
    <input id="amountInput" type="text" inputmode="decimal" placeholder="0.00">
  </div>
  <div class="field">
    <label for="categoryInput">Category</label>
    <input id="categoryInput" list="categoryList" placeholder="e.g. Groceries" autocomplete="off">
    <datalist id="categoryList"></datalist>
  </div>
  <div class="field">
    <label for="noteInput">Note (optional)</label>
    <input id="noteInput" placeholder="Add a note">
  </div>
  <div class="field">
    <label for="dateInput">Date</label>
    <input id="dateInput" type="date">
  </div>
  <div class="sheet-actions">
    <button class="btn btn-delete" id="deleteBtn" style="display:none;">Delete</button>
    <button class="btn btn-save" id="saveBtn">Save</button>
  </div>
</div>

<div id="menuSheet" style="display:none;">
  <div id="menuOverlay"></div>
  <div id="menuPanel">
    <div class="sheet-handle"></div>
    <div class="field">
      <label for="currencySelect">Currency</label>
      <select id="currencySelect">
        <option value="$">$ Dollar</option>
        <option value="&#8369;">&#8369; Peso</option>
        <option value="&#8364;">&#8364; Euro</option>
        <option value="&#163;">&#163; Pound</option>
        <option value="&#165;">&#165; Yen</option>
        <option value="&#8377;">&#8377; Rupee</option>
      </select>
    </div>
    <div class="field">
      <label for="dailyCapInput">Daily spend cap</label>
      <input id="dailyCapInput" type="number" inputmode="decimal" min="1" step="1" placeholder="500">
    </div>
    <button class="menu-action" id="changePasscodeBtn">Change passcode</button>
    <button class="menu-action" id="exportBtn">Export month as CSV</button>
    <button class="menu-action danger" id="clearBtn">Delete all data</button>
  </div>
</div>

<div id="lockScreen">
  <div id="lockCard">
    <div class="lock-title" id="lockTitle">Enter passcode</div>
    <div class="lock-dots" id="lockDots"></div>
    <div class="lock-error" id="lockError"></div>
    <div class="keypad">
      <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
      <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
      <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
      <button class="empty" disabled></button><button data-d="0">0</button><button id="lockBackspace">&#9003;</button>
    </div>
    <button id="keypadDone">Done</button>
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
