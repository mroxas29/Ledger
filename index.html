<style>
  :root{
    --header-bg:#1B2A4A;
    --header-text:#FAF8F3;
    --gold:#C9A66B;
    --green:#2F6B52;
    --rust:#A0402C;
    --bg:#FAF8F3;
    --surface:#FFFFFF;
    --text:#1B2A4A;
    --text-muted:#8A8578;
    --border:#DAD4C4;
    --serif: ui-serif, Georgia, "New York", "Times New Roman", serif;
    --sans: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181F;
      --surface:#1E2430;
      --text:#F1EDE3;
      --text-muted:#9AA0AC;
      --border:#2C333F;
      --green:#4FAE85;
      --rust:#E2725B;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; height:100%; background:var(--header-bg); overscroll-behavior:none;}
  body{ font-family:var(--sans); color:var(--text); background:var(--bg); }
  .page{ display:flex; flex-direction:column; min-height:100vh; }

  /* ---------- Header ---------- */
  header{
    background:var(--header-bg);
    color:var(--header-text);
    padding:calc(14px + var(--safe-top)) 20px 18px;
    flex-shrink:0;
    position:relative;
  }
  .month-row{ display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:16px; }
  .month-row button{ background:none; border:none; color:var(--gold); font-size:22px; line-height:1; padding:6px 10px; cursor:pointer; font-family:var(--serif); }
  .month-label{ font-family:var(--serif); font-size:15px; letter-spacing:.04em; color:var(--header-text); min-width:150px; text-align:center; }
  .balance{ text-align:center; font-family:var(--serif); font-size:44px; font-weight:500; letter-spacing:-0.01em; }
  .balance.negative{ color:#E8A798; }
  .sub-totals{ display:flex; justify-content:center; gap:28px; margin-top:10px; font-size:13px; }
  .sub-totals span{ display:block; }
  .sub-totals .lbl{ color:#ffffff80; font-size:11px; letter-spacing:.03em; margin-bottom:2px;}
  .sub-totals .val-in{ color:#8FCBAE; font-family:var(--serif); font-size:15px;}
  .sub-totals .val-out{ color:#E8A798; font-family:var(--serif); font-size:15px;}

  .icon-btn{ position:absolute; top: calc(16px + var(--safe-top)); background:none; border:none; color:var(--gold); font-size:19px; cursor:pointer; padding:6px; }
  #menuBtn{ right:12px; }
  #dashBtn{ left:12px; font-size:17px; }
  #dashBackBtn{ left:12px; }

  /* quick graph */
  .quick-graph{ margin:2px 20px 14px; }
  .qg-row{ display:flex; align-items:center; gap:10px; margin-bottom:7px; }
  .qg-label{ width:58px; font-size:11px; color:var(--header-text); opacity:.75; flex-shrink:0; }
  .qg-track{ flex:1; height:8px; background:rgba(255,255,255,.15); border-radius:4px; overflow:hidden; }
  .qg-bar{ height:100%; border-radius:4px; transition:width .3s ease; }
  .qg-bar.income{ background:#8FCBAE; }
  .qg-bar.expense{ background:#E8A798; }

  /* tabs (filter + dashboard range) */
  .tabs{ display:flex; gap:8px; }
  .tabs button{ flex:1; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,.25); background:none; color:var(--header-text); font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--sans); }
  .tabs button.active{ background:var(--gold); color:var(--header-bg); border-color:var(--gold); }

  /* ---------- List ---------- */
  main{ flex:1; overflow-y:auto; padding:18px 20px calc(110px + var(--safe-bottom)); }
  .list-total{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-muted); padding:0 2px 12px; border-bottom:1px solid var(--border); margin-bottom:14px; }
  .day-group{ margin-bottom:22px; }
  .day-heading{ font-size:12px; color:var(--text-muted); letter-spacing:.02em; margin:0 0 8px 2px; display:flex; justify-content:space-between; }
  .day-heading .day-total{ color:var(--text); opacity:.7; }
  .entry{ display:flex; align-items:center; padding:11px 2px; border-bottom:1px solid var(--border); cursor:pointer; }
  .entry:last-child{ border-bottom:none; }
  .entry-dot{ width:6px; height:6px; border-radius:50%; margin-right:12px; flex-shrink:0; }
  .entry-dot.income{ background:var(--green); }
  .entry-dot.expense{ background:var(--rust); }
  .entry-main{ flex:1; min-width:0; }
  .entry-cat{ font-size:15px; font-weight:600; }
  .entry-note{ font-size:12.5px; color:var(--text-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .entry-amt{ font-family:var(--serif); font-size:16.5px; flex-shrink:0; padding-left:10px; }
  .entry-amt.income{ color:var(--green); }
  .entry-amt.expense{ color:var(--rust); }

  .empty-state{ text-align:center; color:var(--text-muted); padding:60px 20px; font-size:14px; line-height:1.6; }
  .empty-state .big{ font-family:var(--serif); font-size:19px; color:var(--text); display:block; margin-bottom:6px; }

  /* ---------- FAB ---------- */
  #fab{ position:fixed; right:22px; bottom:calc(26px + var(--safe-bottom)); width:58px; height:58px; border-radius:50%; background:var(--header-bg); color:var(--gold); font-size:28px; border:none; box-shadow:0 6px 18px rgba(0,0,0,.35); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #fab:active{ transform:scale(.94); }

  /* ---------- Sheet ---------- */
  #overlay{ position:fixed; inset:0; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:10; }
  #overlay.show{ opacity:1; pointer-events:auto; }
  #sheet{ position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-radius:20px 20px 0 0; padding:20px 20px calc(24px + var(--safe-bottom)); transform:translateY(105%); transition:transform .28s cubic-bezier(.32,.72,0,1); z-index:11; max-height:88vh; overflow-y:auto; }
  #sheet.show{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 16px; }
  .type-toggle{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:3px; margin-bottom:18px; }
  .type-toggle button{ flex:1; border:none; background:none; padding:10px; border-radius:8px; font-size:14px; font-weight:600; color:var(--text-muted); cursor:pointer; font-family:var(--sans); }
  .type-toggle button.active[data-type="expense"]{ background:var(--rust); color:#fff; }
  .type-toggle button.active[data-type="income"]{ background:var(--green); color:#fff; }

  .amount-row{ display:flex; align-items:baseline; justify-content:center; gap:4px; margin-bottom:22px; }
  #currencySymbol{ font-family:var(--serif); font-size:28px; color:var(--text-muted); }
  #amountInput{ font-family:var(--serif); font-size:42px; border:none; background:none; width:220px; text-align:center; color:var(--text); outline:none; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:6px; letter-spacing:.02em; }
  .field input, .field select{ width:100%; padding:12px 13px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:15px; font-family:var(--sans); color:var(--text); }
  .field input:focus, .field select:focus{ outline:2px solid var(--gold); outline-offset:-1px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn{ flex:1; padding:14px; border-radius:11px; border:none; font-size:15px; font-weight:600; cursor:pointer; font-family:var(--sans); }
  .btn-save{ background:var(--header-bg); color:var(--header-text); }
  .btn-delete{ background:none; color:var(--rust); border:1px solid var(--rust); }
  .btn:active{ opacity:.85; }

  /* ---------- Menu ---------- */
  .menu-action{ display:block; width:100%; text-align:left; background:none; border:none; padding:13px 2px; font-size:15px; color:var(--text); border-bottom:1px solid var(--border); cursor:pointer; font-family:var(--sans); }
  .menu-action.danger{ color:var(--rust); }
  .menu-action:last-child{ border-bottom:none; }

  #toast{ position:fixed; left:50%; bottom:calc(100px + var(--safe-bottom)); transform:translate(-50%, 12px); background:var(--header-bg); color:var(--header-text); padding:10px 18px; border-radius:20px; font-size:13px; opacity:0; transition:all .25s ease; pointer-events:none; z-index:20; white-space:nowrap; }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---------- Dashboard ---------- */
  .summary-card{ background:var(--header-bg); color:var(--header-text); border-radius:16px; padding:22px 20px; margin-bottom:22px; }
  .summary-card .balance{ font-size:38px; }
  .dash-year-heading{ font-family:var(--serif); font-size:13px; color:var(--text-muted); letter-spacing:.05em; margin:18px 2px 10px; }
  .dash-year-heading:first-child{ margin-top:0; }
  .dash-month-row{ padding:12px 2px; border-bottom:1px solid var(--border); cursor:pointer; }
  .dash-month-row:last-child{ border-bottom:none; }
  .dash-month-top{ display:flex; justify-content:space-between; margin-bottom:8px; }
  .dash-month-name{ font-size:14.5px; font-weight:600; }
  .dash-month-net{ font-family:var(--serif); font-size:15px; }
  .dash-bars{ height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin-bottom:4px; }
  .dash-bars:last-child{ margin-bottom:0; }
  .dash-bar{ height:100%; border-radius:3px; }
  .dash-bar.income{ background:var(--green); }
  .dash-bar.expense{ background:var(--rust); }

  /* ---------- Lock screen ---------- */
  #lockScreen{ position:fixed; inset:0; z-index:999; background:var(--header-bg); color:var(--header-text); display:flex; align-items:center; justify-content:center; padding:20px; transition:opacity .25s ease; }
  #lockScreen.hidden{ opacity:0; pointer-events:none; }
  #lockCard{ text-align:center; }
  .lock-title{ font-family:var(--serif); font-size:17px; margin-bottom:22px; letter-spacing:.02em; }
  .lock-dots{ display:flex; justify-content:center; gap:12px; min-height:16px; margin-bottom:14px; }
  .lock-dots .dot{ width:12px; height:12px; border-radius:50%; background:var(--gold); }
  .lock-error{ color:#E8A798; font-size:13px; min-height:18px; margin-bottom:10px; }
  #lockCard.shake{ animation: shake .4s; }
  @keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }
  .keypad{ display:grid; grid-template-columns:repeat(3,64px); gap:16px; margin-top:6px; justify-content:center; }
  .keypad button{ width:64px; height:64px; border-radius:50%; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.06); color:var(--header-text); font-size:22px; font-family:var(--serif); cursor:pointer; }
  .keypad button.empty{ visibility:hidden; cursor:default; }
  .keypad button:active{ background:rgba(255,255,255,.18); }
  #keypadDone{ margin-top:22px; background:var(--gold); color:var(--header-bg); border:none; padding:12px 28px; border-radius:24px; font-weight:600; font-size:14px; cursor:pointer; display:none; }
</style>
</head>
<body>

<div id="ledgerPage" class="page">
  <header>
    <button id="dashBtn" class="icon-btn" aria-label="Dashboard">&#128202;</button>
    <button id="menuBtn" class="icon-btn" aria-label="Menu">&#8942;</button>
    <div class="month-row">
      <button id="prevMonth" aria-label="Previous month">&lsaquo;</button>
      <div class="month-label" id="monthLabel">September 2026</div>
      <button id="nextMonth" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="balance" id="balanceLabel">$0.00</div>
    <div class="sub-totals">
      <span><span class="lbl">INCOME</span><span class="val-in" id="incomeTotal">$0.00</span></span>
      <span><span class="lbl">EXPENSES</span><span class="val-out" id="expenseTotal">$0.00</span></span>
    </div>
    <div class="quick-graph">
      <div class="qg-row"><span class="qg-label">Income</span><div class="qg-track"><div class="qg-bar income" id="qgIncomeBar"></div></div></div>
      <div class="qg-row"><span class="qg-label">Expenses</span><div class="qg-track"><div class="qg-bar expense" id="qgExpenseBar"></div></div></div>
    </div>
    <div class="tabs" id="filterTabs">
      <button data-filter="all" class="active">All</button>
      <button data-filter="income">Income</button>
      <button data-filter="expense">Expense</button>
    </div>
  </header>

  <main>
    <div class="list-total" id="listTotal"></div>
    <div id="list"></div>
  </main>

  <button id="fab" aria-label="Add transaction">+</button>
</div>

<div id="dashboardPage" class="page" style="display:none;">
  <header>
    <button id="dashBackBtn" class="icon-btn" aria-label="Back">&lsaquo;</button>
    <div class="month-row" style="margin-bottom:16px;">
      <div class="month-label">Dashboard</div>
    </div>
    <div class="tabs" id="rangeTabs">
      <button data-range="1y" class="active">1 Year</button>
      <button data-range="2y">2 Years</button>
      <button data-range="all">All Time</button>
    </div>
  </header>
  <main>
    <div class="summary-card">
      <div class="balance" id="dashBalance">$0.00</div>
      <div class="sub-totals">
        <span><span class="lbl">INCOME</span><span class="val-in" id="dashIncome">$0.00</span></span>
        <span><span class="lbl">EXPENSES</span><span class="val-out" id="dashExpense">$0.00</span></span>
      </div>
    </div>
    <div id="dashList"></div>
  </main>
</div>

<div id="overlay"></div>

<div id="sheet">
  <div class="sheet-handle"></div>
  <div class="type-toggle">
    <button type="button" data-type="expense" class="active">Expense</button>
    <button type="button" data-type="income">Income</button>
  </div>
  <div class="amount-row">
    <span id="currencySymbol">$</span>
    <input id="amountInput" type="text" inputmode="decimal" placeholder="0.00">
  </div>
  <div class="field">
    <label for="categoryInput">Category</label>
    <input id="categoryInput" list="categoryList" placeholder="e.g. Groceries" autocomplete="off">
    <datalist id="categoryList"></datalist>
  </div>
  <div class="field">
    <label for="noteInput">Note (optional)</label>
    <input id="noteInput" placeholder="Add a note">
  </div>
  <div class="field">
    <label for="dateInput">Date</label>
    <input id="dateInput" type="date">
  </div>
  <div class="sheet-actions">
    <button class="btn btn-delete" id="deleteBtn" style="display:none;">Delete</button>
    <button class="btn btn-save" id="saveBtn">Save</button>
  </div>
</div>

<div id="menuSheet" style="display:none;">
  <div id="menuOverlay"></div>
  <div id="menuPanel">
    <div class="sheet-handle"></div>
    <div class="field">
      <label for="currencySelect">Currency</label>
      <select id="currencySelect">
        <option value="$">$ Dollar</option>
        <option value="&#8369;">&#8369; Peso</option>
        <option value="&#8364;">&#8364; Euro</option>
        <option value="&#163;">&#163; Pound</option>
        <option value="&#165;">&#165; Yen</option>
        <option value="&#8377;">&#8377; Rupee</option>
      </select>
    </div>
    <button class="menu-action" id="changePasscodeBtn">Change passcode</button>
    <button class="menu-action" id="exportBtn">Export month as CSV</button>
    <button class="menu-action danger" id="clearBtn">Delete all data</button>
  </div>
</div>

<div id="lockScreen">
  <div id="lockCard">
    <div class="lock-title" id="lockTitle">Enter passcode</div>
    <div class="lock-dots" id="lockDots"></div>
    <div class="lock-error" id="lockError"></div>
    <div class="keypad">
      <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
      <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
      <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
      <button class="empty" disabled></button><button data-d="0">0</button><button id="lockBackspace">&#9003;</button>
    </div>
    <button id="keypadDone">Done</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "ledger_transactions_v1";
  const CURRENCY_KEY = "ledger_currency_v1";
  const PASSCODE_KEY = "ledger_passcode_v1";
  const DEFAULT_CATEGORIES = ["Food","Groceries","Transport","Bills","Rent","Shopping","Entertainment","Health","Salary","Freelance","Savings","Other"];

  let transactions = load();
  let currency = localStorage.getItem(CURRENCY_KEY) || "$";
  let viewDate = new Date();
  viewDate.setDate(1);
  let editingId = null;
  let filterState = "all";

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions)); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fmt(n){
    const sign = n < 0 ? "-" : "";
    return sign + currency + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function isoDate(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function todayISO(){ return isoDate(new Date()); }
  function monthLabel(d){ return d.toLocaleDateString(undefined, { month:"long", year:"numeric" }); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }
  function dayHeadingLabel(iso){
    const today = todayISO();
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = isoDate(y);
    if(iso === today) return "Today";
    if(iso === yesterday) return "Yesterday";
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  }

  function entryDateLabel(t){
    const d = new Date(t.date + "T00:00:00");
    const dateStr = d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
    let timeStr = "";
    if(t.createdAt){
      timeStr = " &middot; logged " + new Date(t.createdAt).toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
    }
    return dateStr + timeStr;
  }

  function transactionsForMonth(){
    const y = viewDate.getFullYear(), m = viewDate.getMonth();
    return transactions.filter(t=>{
      const d = new Date(t.date + "T00:00:00");
      return d.getFullYear() === y && d.getMonth() === m;
    });
  }

  function render(){
    document.getElementById("monthLabel").textContent = monthLabel(viewDate);
    const monthTx = transactionsForMonth();
    let income = 0, expense = 0;
    monthTx.forEach(t=> t.type === "income" ? income += t.amount : expense += t.amount);
    const balance = income - expense;
    const balEl = document.getElementById("balanceLabel");
    balEl.textContent = fmt(balance);
    balEl.classList.toggle("negative", balance < 0);
    document.getElementById("incomeTotal").textContent = fmt(income);
    document.getElementById("expenseTotal").textContent = fmt(expense);

    const maxIE = Math.max(income, expense, 1);
    document.getElementById("qgIncomeBar").style.width = (income/maxIE*100) + "%";
    document.getElementById("qgExpenseBar").style.width = (expense/maxIE*100) + "%";

    let listTx = monthTx;
    if(filterState === "income") listTx = monthTx.filter(t=>t.type==="income");
    else if(filterState === "expense") listTx = monthTx.filter(t=>t.type==="expense");

    const filteredTotal = listTx.reduce((s,t)=> s + (t.type==="income" ? t.amount : -t.amount), 0);
    const totalLabel = filterState === "income" ? "Total income" : filterState === "expense" ? "Total expenses" : "Net total";
    document.getElementById("listTotal").innerHTML = `<span>${totalLabel}</span><span>${fmt(filterState==="expense" ? Math.abs(filteredTotal) : filteredTotal)}</span>`;

    const byDate = {};
    listTx.forEach(t=>{ (byDate[t.date] = byDate[t.date] || []).push(t); });
    const dates = Object.keys(byDate).sort().reverse();

    const list = document.getElementById("list");
    list.innerHTML = "";

    if(dates.length === 0){
      list.innerHTML = `<div class="empty-state"><span class="big">Nothing logged yet</span>Tap the + button to add your first income or expense for this month.</div>`;
      return;
    }

    dates.forEach(dateKey=>{
      const items = byDate[dateKey].sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
      let dayNet = 0;
      items.forEach(t=> dayNet += (t.type === "income" ? t.amount : -t.amount));

      const group = document.createElement("div");
      group.className = "day-group";
      const heading = document.createElement("div");
      heading.className = "day-heading";
      heading.innerHTML = `<span>${dayHeadingLabel(dateKey)}</span><span class="day-total">${fmt(dayNet)}</span>`;
      group.appendChild(heading);

      items.forEach(t=>{
        const row = document.createElement("div");
        row.className = "entry";
        row.innerHTML = `
          <span class="entry-dot ${t.type}"></span>
          <span class="entry-main">
            <div class="entry-cat">${escapeHtml(t.category)}</div>
            <div class="entry-note">${entryDateLabel(t)}${t.note ? " &middot; " + escapeHtml(t.note) : ""}</div>
          </span>
          <span class="entry-amt ${t.type}">${t.type === "expense" ? "-" : "+"}${currency}${t.amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",")}</span>
        `;
        row.addEventListener("click", ()=> openSheet(t.id));
        group.appendChild(row);
      });
      list.appendChild(group);
    });
  }

  // ---------- Filter tabs ----------
  document.querySelectorAll("#filterTabs button").forEach(b=>{
    b.addEventListener("click", ()=>{
      filterState = b.dataset.filter;
      document.querySelectorAll("#filterTabs button").forEach(x=> x.classList.toggle("active", x===b));
      render();
    });
  });

  // ---------- Sheet (add/edit) ----------
  const sheet = document.getElementById("sheet");
  const overlay = document.getElementById("overlay");
  const amountInput = document.getElementById("amountInput");
  const categoryInput = document.getElementById("categoryInput");
  const noteInput = document.getElementById("noteInput");
  const dateInput = document.getElementById("dateInput");
  const deleteBtn = document.getElementById("deleteBtn");
  const currencySymbolEl = document.getElementById("currencySymbol");

  function formatAmountTyping(){
    let v = amountInput.value;
    v = v.replace(/[^\d.]/g,"");
    const firstDot = v.indexOf(".");
    if(firstDot !== -1){ v = v.slice(0,firstDot+1) + v.slice(firstDot+1).replace(/\./g,""); }
    let parts = v.split(".");
    let intPart = parts[0] || "";
    let decPart = parts.length > 1 ? parts[1].slice(0,2) : undefined;
    intPart = intPart.replace(/^0+(?=\d)/, "");
    let formattedInt = intPart ? intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "";
    let result = formattedInt;
    if(decPart !== undefined) result += "." + decPart;
    else if(v.endsWith(".")) result += ".";
    amountInput.value = result;
  }
  amountInput.addEventListener("input", formatAmountTyping);

  function refreshCategoryList(){
    const used = Array.from(new Set(transactions.map(t=>t.category)));
    const all = Array.from(new Set([...DEFAULT_CATEGORIES, ...used]));
    document.getElementById("categoryList").innerHTML = all.map(c=>`<option value="${escapeHtml(c)}">`).join("");
  }

  function setType(type){
    document.querySelectorAll(".type-toggle button").forEach(b=> b.classList.toggle("active", b.dataset.type === type));
    sheet.dataset.type = type;
  }

  function openSheet(id){
    editingId = id || null;
    currencySymbolEl.textContent = currency;
    refreshCategoryList();
    if(id){
      const t = transactions.find(x=>x.id === id);
      setType(t.type);
      amountInput.value = String(t.amount);
      formatAmountTyping();
      categoryInput.value = t.category;
      noteInput.value = t.note || "";
      dateInput.value = t.date;
      deleteBtn.style.display = "block";
    } else {
      setType("expense");
      amountInput.value = "";
      categoryInput.value = "";
      noteInput.value = "";
      const now = new Date();
      dateInput.value = (viewDate.getMonth() === now.getMonth() && viewDate.getFullYear() === now.getFullYear()) ? isoDate(now) : isoDate(viewDate);
      deleteBtn.style.display = "none";
    }
    overlay.classList.add("show");
    sheet.classList.add("show");
    setTimeout(()=> amountInput.focus(), 250);
  }
  function closeSheet(){
    overlay.classList.remove("show");
    sheet.classList.remove("show");
    editingId = null;
  }

  document.querySelectorAll(".type-toggle button").forEach(b=> b.addEventListener("click", ()=> setType(b.dataset.type)));
  document.getElementById("fab").addEventListener("click", ()=> openSheet(null));
  overlay.addEventListener("click", ()=>{ closeSheet(); closeMenu(); });

  document.getElementById("saveBtn").addEventListener("click", ()=>{
    const amount = parseFloat(amountInput.value.replace(/,/g,""));
    const category = categoryInput.value.trim();
    const date = dateInput.value;
    const type = sheet.dataset.type || "expense";
    if(!amount || amount <= 0){ toast("Enter an amount"); amountInput.focus(); return; }
    if(!category){ toast("Enter a category"); categoryInput.focus(); return; }
    if(!date){ toast("Pick a date"); return; }

    if(editingId){
      const t = transactions.find(x=>x.id === editingId);
      Object.assign(t, { amount, category, date, type, note: noteInput.value.trim() });
    } else {
      transactions.push({ id: uid(), amount, category, date, type, note: noteInput.value.trim(), createdAt: Date.now() });
    }
    persist();
    viewDate = new Date(date + "T00:00:00"); viewDate.setDate(1);
    render();
    closeSheet();
    toast("Saved");
  });

  deleteBtn.addEventListener("click", ()=>{
    if(!editingId) return;
    if(!confirm("Delete this entry? This can't be undone.")) return;
    transactions = transactions.filter(t=>t.id !== editingId);
    persist();
    render();
    closeSheet();
    toast("Deleted");
  });

  document.getElementById("prevMonth").addEventListener("click", ()=>{ viewDate.setMonth(viewDate.getMonth()-1); render(); });
  document.getElementById("nextMonth").addEventListener("click", ()=>{ viewDate.setMonth(viewDate.getMonth()+1); render(); });

  // ---------- Menu ----------
  const menuSheet = document.getElementById("menuSheet");
  const menuPanel = document.getElementById("menuPanel");
  const menuOverlay = document.getElementById("menuOverlay");
  menuPanel.style.cssText = "position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 20px calc(24px + var(--safe-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,0,1);z-index:11;";
  menuOverlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:10;";
  menuSheet.style.display = "block";
  document.getElementById("currencySelect").value = currency;

  function openMenu(){ menuOverlay.style.opacity = "1"; menuOverlay.style.pointerEvents = "auto"; menuPanel.style.transform = "translateY(0)"; }
  function closeMenu(){ menuOverlay.style.opacity = "0"; menuOverlay.style.pointerEvents = "none"; menuPanel.style.transform = "translateY(105%)"; }
  document.getElementById("menuBtn").addEventListener("click", openMenu);
  menuOverlay.addEventListener("click", closeMenu);

  document.getElementById("currencySelect").addEventListener("change", (e)=>{
    currency = e.target.value;
    localStorage.setItem(CURRENCY_KEY, currency);
    render();
  });

  document.getElementById("exportBtn").addEventListener("click", ()=>{
    const monthTx = transactionsForMonth().sort((a,b)=> a.date.localeCompare(b.date));
    if(monthTx.length === 0){ toast("Nothing to export"); return; }
    let csv = "Date,Type,Category,Note,Amount\n";
    monthTx.forEach(t=>{
      const row = [t.date, t.type, t.category, (t.note||"").replace(/,/g," "), t.amount.toFixed(2)];
      csv += row.join(",") + "\n";
    });
    const blob = new Blob([csv], { type:"text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ledger-${viewDate.getFullYear()}-${String(viewDate.getMonth()+1).padStart(2,"0")}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    closeMenu();
  });

  document.getElementById("clearBtn").addEventListener("click", ()=>{
    if(confirm("Delete all logged transactions? This can't be undone.")){
      transactions = [];
      persist();
      render();
      closeMenu();
      toast("All data cleared");
    }
  });

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg){
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove("show"), 1600);
  }

  // ---------- Pages (ledger / dashboard) ----------
  function showPage(name){
    document.getElementById("ledgerPage").style.display = name === "ledger" ? "flex" : "none";
    document.getElementById("dashboardPage").style.display = name === "dashboard" ? "flex" : "none";
    if(name === "dashboard") renderDashboard();
  }
  document.getElementById("dashBtn").addEventListener("click", ()=> showPage("dashboard"));
  document.getElementById("dashBackBtn").addEventListener("click", ()=> showPage("ledger"));

  let dashRange = "1y";
  document.querySelectorAll("#rangeTabs button").forEach(b=>{
    b.addEventListener("click", ()=>{
      dashRange = b.dataset.range;
      document.querySelectorAll("#rangeTabs button").forEach(x=> x.classList.toggle("active", x===b));
      renderDashboard();
    });
  });

  function monthsBack(n){
    const list = [];
    const d = new Date(); d.setDate(1);
    for(let i=0;i<n;i++){
      list.push({ year:d.getFullYear(), month:d.getMonth() });
      d.setMonth(d.getMonth()-1);
    }
    return list;
  }
  function computeMonthTotals(year, month){
    let income=0, expense=0;
    transactions.forEach(t=>{
      const dt = new Date(t.date+"T00:00:00");
      if(dt.getFullYear()===year && dt.getMonth()===month){
        if(t.type==="income") income+=t.amount; else expense+=t.amount;
      }
    });
    return { income, expense };
  }

  function renderDashboard(){
    let monthsList;
    if(dashRange === "all"){
      if(transactions.length === 0){
        monthsList = monthsBack(1);
      } else {
        const times = transactions.map(t=> new Date(t.date+"T00:00:00").getTime());
        const minDate = new Date(Math.min(...times));
        const now = new Date(); now.setDate(1);
        const start = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
        const totalMonths = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth()) + 1;
        monthsList = monthsBack(Math.max(totalMonths,1));
      }
    } else {
      monthsList = monthsBack(dashRange === "1y" ? 12 : 24);
    }

    let totalIncome = 0, totalExpense = 0;
    const dashList = document.getElementById("dashList");
    dashList.innerHTML = "";
    let currentYear = null;

    monthsList.forEach(({year,month})=>{
      const { income, expense } = computeMonthTotals(year, month);
      totalIncome += income; totalExpense += expense;
      if(year !== currentYear){
        currentYear = year;
        const yh = document.createElement("div");
        yh.className = "dash-year-heading";
        yh.textContent = String(year);
        dashList.appendChild(yh);
      }
      const max = Math.max(income, expense, 1);
      const monthName = new Date(year, month, 1).toLocaleDateString(undefined, { month:"long" });
      const row = document.createElement("div");
      row.className = "dash-month-row";
      row.innerHTML = `
        <div class="dash-month-top">
          <span class="dash-month-name">${monthName}</span>
          <span class="dash-month-net">${fmt(income-expense)}</span>
        </div>
        <div class="dash-bars"><div class="dash-bar income" style="width:${(income/max*100)}%"></div></div>
        <div class="dash-bars"><div class="dash-bar expense" style="width:${(expense/max*100)}%"></div></div>
      `;
      row.addEventListener("click", ()=>{
        viewDate = new Date(year, month, 1);
        showPage("ledger");
        render();
      });
      dashList.appendChild(row);
    });

    document.getElementById("dashBalance").textContent = fmt(totalIncome-totalExpense);
    document.getElementById("dashIncome").textContent = fmt(totalIncome);
    document.getElementById("dashExpense").textContent = fmt(totalExpense);
  }

  // ---------- Passcode lock ----------
  function getPasscode(){ return localStorage.getItem(PASSCODE_KEY) || "46334"; }

  let lockMode = "unlock";
  let lockBuffer = "";
  let pendingNewPasscode = "";

  function renderLockDots(){
    document.getElementById("lockDots").innerHTML = lockBuffer.length
      ? lockBuffer.split("").map(()=> `<span class="dot"></span>`).join("")
      : `&nbsp;`;
  }
  function showLockError(msg){
    document.getElementById("lockError").textContent = msg;
    lockBuffer = "";
    renderLockDots();
    const card = document.getElementById("lockCard");
    card.classList.add("shake");
    setTimeout(()=> card.classList.remove("shake"), 400);
    setTimeout(()=>{ document.getElementById("lockError").textContent = ""; }, 2200);
  }
  function showLockScreen(mode){
    lockMode = mode;
    lockBuffer = "";
    document.getElementById("lockScreen").classList.remove("hidden");
    const titles = { unlock:"Enter passcode", verifyOld:"Enter current passcode", setNew:"Enter new passcode (min 4 digits)", confirmNew:"Re-enter new passcode" };
    document.getElementById("lockTitle").textContent = titles[mode];
    document.getElementById("keypadDone").style.display = "none";
    document.getElementById("lockError").textContent = "";
    renderLockDots();
  }
  function handleLockSubmit(){
    if(lockMode === "unlock"){
      if(lockBuffer === getPasscode()){
        document.getElementById("lockScreen").classList.add("hidden");
      } else { showLockError("Incorrect passcode"); }
    } else if(lockMode === "verifyOld"){
      if(lockBuffer === getPasscode()){
        showLockScreen("setNew");
      } else { showLockError("Incorrect passcode"); }
    }
  }
  function keypadPress(d){
    lockBuffer += d;
    renderLockDots();
    if((lockMode === "unlock" || lockMode === "verifyOld") && lockBuffer.length === getPasscode().length){
      handleLockSubmit();
    }
    if(lockMode === "setNew" || lockMode === "confirmNew"){
      document.getElementById("keypadDone").style.display = lockBuffer.length >= 4 ? "block" : "none";
    }
  }
  document.querySelectorAll(".keypad button[data-d]").forEach(b=> b.addEventListener("click", ()=> keypadPress(b.dataset.d)));
  document.getElementById("lockBackspace").addEventListener("click", ()=>{
    lockBuffer = lockBuffer.slice(0,-1);
    renderLockDots();
    if(lockMode === "setNew" || lockMode === "confirmNew"){
      document.getElementById("keypadDone").style.display = lockBuffer.length >= 4 ? "block" : "none";
    }
  });
  document.getElementById("keypadDone").addEventListener("click", ()=>{
    if(lockMode === "setNew"){
      if(lockBuffer.length < 4){ showLockError("Use at least 4 digits"); return; }
      pendingNewPasscode = lockBuffer;
      showLockScreen("confirmNew");
    } else if(lockMode === "confirmNew"){
      if(lockBuffer === pendingNewPasscode && lockBuffer.length >= 4){
        localStorage.setItem(PASSCODE_KEY, pendingNewPasscode);
        document.getElementById("lockScreen").classList.add("hidden");
        toast("Passcode updated");
      } else {
        pendingNewPasscode = "";
        showLockError("Codes didn't match, try again");
        showLockScreen("setNew");
      }
    }
  });
  document.getElementById("changePasscodeBtn").addEventListener("click", ()=>{
    closeMenu();
    showLockScreen("verifyOld");
  });

  render();
  showLockScreen("unlock");
})();
</script>
</body>
</html>
